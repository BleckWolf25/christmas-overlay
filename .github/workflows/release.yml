name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build exe
        run: pyinstaller tests/ChristmasOverlay.spec
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChristmasOverlay.exe
          generate_release_notes: true